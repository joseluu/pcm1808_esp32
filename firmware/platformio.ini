; Phase 3 — test de capture I2S independant du BLE, ADC PCM1808 -> ESP32-S3.
; Carte definitive du projet (ESP32-S3 Supermini, meme carte physique que firmware/
; esp32s3_com12 — reflashee temporairement pour ce test, voir
; docs/plan_implementation.md Phase 3).

[platformio]
src_dir = main

[env:esp32s3_i2s_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM15
monitor_port = COM15
; Carte reelle = ESP32-S3 Supermini, flash EMBARQUEE 4MB (+ PSRAM 2MB embarquee) —
; confirme par `esptool flash_id` le 2026-10-04 (chip QFN56 v0.2, flash XMC 4MB,
; PSRAM AP_3v3 2MB, mode USB-Serial/JTOG natif). Le board preset devkitc-1
; suppose 8MB par defaut -> mismatch a l'upload si non corrige ici.
board_build.flash_size = 4MB
